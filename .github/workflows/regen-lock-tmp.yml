# Temporal (L9): regenera package.json y package-lock.json sin las devDependencies de TypeScript y
# se borra a sí mismo en ese mismo commit. Se dispara por push porque workflow_dispatch solo
# existe para workflows que ya están en main.
name: regen-lock-tmp
on:
  push:
    branches: [chore/l9-drop-ts-devdeps]
    paths: ['.github/workflows/regen-lock-tmp.yml']
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm uninstall typescript @types/node @types/react @types/react-dom --package-lock-only --ignore-scripts
      - name: Commit y autoborrado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/regen-lock-tmp.yml
          git add package.json package-lock.json
          git commit -m "chore(l9): quitar typescript y @types del package.json y del lockfile"
          git push
